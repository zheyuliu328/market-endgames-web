name: Verify and publish game
on:
  push:
    branches: [codex/public-release]
    paths: ["dist/**", "tools/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-game-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify packages, licences and manifests
        run: python3 tools/verify-public.py
      - name: Verify accounting, review and timing boundaries
        run: |
          for check in tools/verify-*.mjs; do
            node "$check"
          done
      - name: Confirm reproducible static manifest
        run: git diff --exit-code -- dist/release-manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified static game
        id: deployment
        uses: actions/deploy-pages@v4
